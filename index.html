<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Pengaduan Warga — Kelurahan Songgokerto</title>
  <style>
    :root {
      --ink: #142033;
      --ink-soft: #334155;
      --paper: #f1ecdd;
      --paper-alt: #e7dfc7;
      --card: rgba(255, 255, 255, 0.2);
      --pine: #173c2d;
      --pine-light: #214f3b;
      --rust: #aa4b1e;
      --gold: #c5973c;
      --teal: #3b6f69;
      --moss: #4f7a50;
      --line: rgba(255,255,255,0.28);
      --focus: #1f7ae0;
      --radius: 3px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, #07518d, #1196c7 48%, #152b70);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -7%;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(3, 20, 55, .18), rgba(0, 127, 198, .04) 48%, rgba(5, 15, 52, .18)),
        url('img/aurora.jpg') center / cover no-repeat;
      z-index: 0;
      transform: scale(1.04) translate3d(-1%, 1%, 0);
      transform-origin: center;
      animation: aurora-flow 22s ease-in-out infinite alternate;
    }

    @keyframes aurora-flow {
      0% {
        transform: scale(1.04) translate3d(-1%, 1%, 0);
        background-position: 44% 52%;
      }
      35% {
        transform: scale(1.11) translate3d(1.5%, -1%, 0);
        background-position: 58% 46%;
      }
      70% {
        transform: scale(1.08) translate3d(-1%, -2%, 0);
        background-position: 66% 56%;
      }
      100% {
        transform: scale(1.05) translate3d(1%, 1%, 0);
        background-position: 48% 50%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }

    .page-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .topbar {
      background: rgba(12, 55, 43, 0.72);
      border-bottom: 1px solid rgba(255,255,255,0.18);
      color: #edf3f5;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .main-nav .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #fff;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4ad0ff, #9be6ff);
      box-shadow: 0 0 10px rgba(74,208,255,.8);
    }

    .tabbar {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 14px 20px 0;
      background: rgba(12, 55, 43, 0.75);
    }

    .tab {
      background: rgba(255,255,255,0.08);
      color: #edf5ff;
      border: none;
      padding: 10px 18px;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      font-weight: 700;
    }

    .tab[aria-selected="true"] {
      background: rgba(255,255,255,0.9);
      color: var(--pine);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 20px 80px;
    }

    .panel {
      display: none;
    }

    .panel.active { display: block; }

    .panel-inner {
      background: rgba(235, 242, 255, 0.6);
      border: 1px solid rgba(255,255,255,0.26);
      box-shadow: 0 8px 24px rgba(8, 20, 36, 0.12);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 4px;
      padding: 18px 22px 22px;
    }

    .form-head {
      margin-bottom: 10px;
    }

    .form-head h2 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(26px, 3vw, 34px);
      color: var(--pine);
    }

    .form-head p {
      margin: 0;
      font-size: 14px;
      color: var(--ink-soft);
    }

    .field {
      display: flex;
      gap: 14px;
      padding: 16px 0;
      border-top: 1px dashed rgba(20,32,51,0.36);
    }

    .field:first-of-type { border-top: none; }

    .field-num {
      flex: 0 0 26px;
      font-weight: 700;
      color: var(--gold);
      font-size: 13px;
      padding-top: 9px;
    }

    .field-body { flex: 1; min-width: 0; }
    .row2 {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .row2 > .field-body { flex: 1 1 220px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    input, select, textarea {
      width: 100%;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(87, 94, 109, 0.2);
      border-radius: 2px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    fieldset {
      border: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .urg-opt {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .urg-opt input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .urg-opt label {
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(20,32,51,0.2);
      background: rgba(255,255,255,0.8);
      color: var(--ink-soft);
      cursor: pointer;
    }

    .urg-opt input:checked + label {
      background: var(--pine);
      border-color: var(--pine);
      color: #fff;
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px dashed rgba(20,32,51,0.36);
      flex-wrap: wrap;
    }

    .primary {
      background: var(--rust);
      border: none;
      color: white;
      padding: 12px 22px;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
    }

    .req-note {
      color: var(--ink-soft);
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #eaf4ff;
      background: rgba(9, 17, 32, 0.54);
      padding: 18px 12px 24px;
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .tabbar {
        overflow-x: auto;
        white-space: nowrap;
        flex-wrap: nowrap;
        padding-left: 12px;
        padding-right: 12px;
      }

      .panel-inner {
        padding: 14px 14px 18px;
      }

      .field {
        flex-direction: column;
        gap: 8px;
      }

      .field-num {
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="main-nav">
        <span class="brand"><span class="brand-dot"></span> Kelurahan</span>
        <span>Portal Pengaduan Warga</span>
      </div>
      <div class="main-nav">
        <span>Info</span>
        <span>Pengaduan</span>
      </div>
    </header>

    <div class="tabbar" role="tablist" aria-label="Navigasi portal">
      <button class="tab" role="tab" aria-selected="true">01 · Ajukan Laporan</button>
      <button class="tab" role="tab" aria-selected="false">02 · Daftar Laporan</button>
      <button class="tab" role="tab" aria-selected="false">03 · Dashboard Admin</button>
      <button class="tab" role="tab" aria-selected="false">04 · Rekapitulasi</button>
    </div>

    <main>
      <section class="panel active">
        <div class="panel-inner">
          <div class="form-head">
            <h2>Formulir Pengaduan</h2>
            <p>Isi formulir di bawah ini dengan lengkap agar petugas kelurahan dapat menindaklanjuti laporan Anda.</p>
          </div>

          <form>
            <div class="field">
              <span class="field-num">01</span>
              <div class="field-body row2">
                <div class="field-body">
                  <label>Nama pelapor</label>
                  <input type="text" placeholder="Nama Anda" />
                </div>
                <div class="field-body">
                  <label>Nomor HP / WhatsApp</label>
                  <input type="tel" placeholder="08xxxxxxxxxx" />
                </div>
              </div>
            </div>

            <div class="field">
              <span class="field-num">02</span>
              <div class="field-body">
                <label>Alamat / RT / RW</label>
                <input type="text" placeholder="Contoh: Jl. Mawar No. 12, RT 03 / RW 05" />
              </div>
            </div>

            <div class="field">
              <span class="field-num">03</span>
              <div class="field-body row2">
                <div class="field-body">
                  <label>Kategori laporan</label>
                  <select>
                    <option>Pilih kategori</option>
                    <option>Infrastruktur & Jalan</option>
                    <option>Kebersihan & Lingkungan</option>
                    <option>Keamanan & Ketertiban</option>
                    <option>Sosial & Bantuan Warga</option>
                    <option>Administrasi Kependudukan</option>
                  </select>
                </div>
                <div class="field-body">
                  <label>Tingkat urgensi</label>
                  <fieldset>
                    <div class="urg-opt">
                      <input type="radio" name="urgensi" id="r1" />
                      <label for="r1">Rendah</label>
                    </div>
                    <div class="urg-opt">
                      <input type="radio" name="urgensi" id="r2" checked />
                      <label for="r2">Sedang</label>
                    </div>
                    <div class="urg-opt">
                      <input type="radio" name="urgensi" id="r3" />
                      <label for="r3">Tinggi</label>
                    </div>
                  </fieldset>
                </div>
              </div>
            </div>

            <div class="field">
              <span class="field-num">04</span>
              <div class="field-body">
                <label>Judul singkat laporan</label>
                <input type="text" placeholder="Contoh: Lampu jalan mati di Gang Melati" />
              </div>
            </div>

            <div class="field">
              <span class="field-num">05</span>
              <div class="field-body">
                <label>Uraian kejadian</label>
                <textarea placeholder="Jelaskan kejadian secara rinci: lokasi tepat, waktu kejadian, dan dampaknya."></textarea>
              </div>
            </div>

            <div class="field">
              <span class="field-num">06</span>
              <div class="field-body">
                <label>Foto pendukung (opsional, maksimal 5 MB)</label>
                <input type="file" />
              </div>
            </div>

            <div class="submit-row">
              <button class="primary" type="button">Kirim Laporan</button>
              <span class="req-note">Nomor tiket akan diberikan setelah laporan terkirim.</span>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer>
      Laporan warga hanya dapat dilihat dan dikelola oleh admin.
    </footer>
  </div>
</body>
</html>
